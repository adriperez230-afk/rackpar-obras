<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACKPAR · Estado de obra</title>
<style>
:root{--red:#DA1B23;--ink:#1F2328;--mut:#6B7280;--line:#E5E7EB;--ok:#15803D}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:#F5F5F6;color:var(--ink)}
header{background:var(--red);padding:14px 18px;display:flex;align-items:center;gap:12px}
header .ic{height:54px;border-radius:8px}
header .wm{height:52px;max-width:60vw}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#DA1B23,#9E1017);color:#fff;border-radius:14px;padding:18px}
.hero .ot{font-size:13px;opacity:.9;font-weight:700;letter-spacing:1px}
.hero h1{margin:4px 0 6px;font-size:22px}
.hero .m{font-size:13px;opacity:.95;display:flex;gap:14px;flex-wrap:wrap}
.badge{display:inline-block;background:#fff;color:var(--red);font-weight:800;font-size:12px;border-radius:14px;padding:4px 12px;margin-top:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:15px}
.stg{margin-bottom:16px}
.stg .h{display:flex;align-items:baseline;gap:8px}
.stg .n{font-weight:800;font-size:15px;flex:1}
.stg .p{font-size:26px;font-weight:900}
.trk{height:16px;background:#EEF0F3;border-radius:8px;overflow:hidden;margin:6px 0 4px}
.trk i{display:block;height:100%;border-radius:8px}
.stg .f{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;border-bottom:2px solid var(--red);padding:6px;font-size:11.5px}
td{padding:6px;border-bottom:1px solid #F0F0F0}
td.n,th.n{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.tw{overflow:auto}
.upd{text-align:center;font-size:12px;color:var(--mut);margin:16px 0}
.srch{display:flex;gap:8px}.srch input{flex:1;padding:12px;border:1px solid #D1D5DB;border-radius:8px;font-size:16px}
.srch button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:0 18px;font-weight:700;font-size:15px}
.msg{text-align:center;color:var(--mut);padding:30px 10px}
</style>
</head>

const fmt=(v,d=0)=>(v||0).toLocaleString('es-PY',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>Math.round((v||0)*100);
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
const ot=new URLSearchParams(location.search).get('ot');
function search(){app.innerHTML=`<div class="card"><h2>Consultar estado de obra</h2><form class="srch" onsubmit="location.search='?ot='+encodeURIComponent(this.q.value.trim());return false"><input name="q" inputmode="numeric" placeholder="N° de OT"><button>Ver</button></form></div>`}
fetch('estado_obras.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(D=>{
  if(!ot){search();return}
  const o=D.ots[ot];
  if(!o){app.innerHTML=`<div class="card msg">No encontramos la OT <b>${esc(ot)}</b>.</div>`;search();return}
  const bar=s=>{const c=o.pz?o[s][0]/o.pz:0,k=o.kg?o[s][1]/o.kg:0,ok=c>=.9999,col=ok?'#15803D':ST[s][1];
    return `<div class="stg"><div class="h"><span class="n">${ST[s][0]}</span><span class="p" style="color:${col}">${pct(c)}%</span></div>
    <div class="trk"><i style="width:${Math.min(100,c*100)}%;background:${col}"></i></div>
    <div class="f"><span>${fmt(o[s][0])} de ${fmt(o.pz)} piezas ${ST[s][2]}</span><span>${pct(k)}% del peso</span></div></div>`};
  const dias=o.dias.map(([d,v])=>Object.entries(v).map(([s,x])=>`<tr><td>${dmy(d)}</td><td><span class="dot" style="background:${ST[s][1]}"></span>${ST[s][0]}</td><td class="n">${fmt(x[0])}</td><td class="n">${fmt(x[1],1)}</td></tr>`).join('')).join('');
  app.innerHTML=`<div class="hero"><div class="ot">OT ${esc(ot)}</div><h1>${esc(o.o)}</h1><div class="m"><span>${esc(o.c)}</span><span>${fmt(o.pz)} piezas · ${fmt(o.kg)} kg</span></div><span class="badge">${STL[o.st]||''}</span></div>
  <div class="card"><h2>Avance de la obra</h2>${['A','P','E','M'].map(bar).join('')}</div>
  ${dias?`<div class="card"><h2>Avance diario (últimos registros)</h2><div class="tw"><table><tr><th>Fecha</th><th>Etapa</th><th class="n">Piezas</th><th class="n">Kg</th></tr>${dias}</table></div></div>`:''}
  <div class="card"><details><summary>Detalle por pieza (${o.pzs.length})</summary><div class="tw" style="margin-top:10px"><table><tr><th>Pieza</th><th>Descripción</th><th class="n">Cant.</th><th class="n">Arm.</th><th class="n">Pint.</th><th class="n">Env.</th><th class="n">Mont.</th></tr>
  ${o.pzs.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td class="n">${fmt(p[2])}</td>${[4,5,6,7].map(i=>`<td class="n" style="${p[i]>=p[2]?'color:#15803D;font-weight:700':''}">${fmt(p[i])}</td>`).join('')}</tr>`).join('')}</table></div></details></div>
  <div class="upd">Actualizado al ${dmy(D.lpt)} · RACKPAR S.A. · Optimizamos tu espacio</div>`;
  document.title='OT '+ot+' · '+o.o+' · RACKPAR';
}).catch(()=>{app.innerHTML='<div class="card msg">No se pudo cargar el estado de obras. Intentá nuevamente en unos minutos.</div>'});
</script>
</body>
</html>
